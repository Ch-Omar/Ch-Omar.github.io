<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Switch Rail</title>
<meta name="description" content="Flip the switches so every wagon reaches its station. It keeps speeding up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
const COLORS = ['#f0505e', '#4f8ef2', '#ffd54a', '#5acb74'];
// stations, trains to deliver, speed (board heights per second), seconds between trains
const SPEC = [[2, 6, 0.2, 3.2], [2, 9, 0.24, 2.6], [3, 9, 0.22, 3], [3, 12, 0.25, 2.5], [3, 14, 0.28, 2.1], [4, 12, 0.24, 2.6], [4, 15, 0.27, 2.2], [4, 18, 0.3, 1.9], [4, 20, 0.33, 1.7], [4, 24, 0.36, 1.5]];

function track(S) {
  // nodes in board units (0..1); a switch has two children, a station has a colour
  const st = (x, c) => ({ x, y: 0.93, c });
  if (S === 2) return { x: 0.5, y: 0.42, kids: [st(0.25, 0), st(0.75, 1)] };
  if (S === 3) return { x: 0.5, y: 0.3, kids: [st(0.18, 0), { x: 0.68, y: 0.6, kids: [st(0.5, 1), st(0.86, 2)] }] };
  return { x: 0.5, y: 0.26, kids: [{ x: 0.28, y: 0.58, kids: [st(0.13, 0), st(0.4, 1)] }, { x: 0.72, y: 0.58, kids: [st(0.6, 2), st(0.87, 3)] }] };
}

Kit.start({
  id: 'rail', title: 'Switch Rail', accent: ['#ff9a3c', '#c26a17'],
  help: ['Coloured wagons roll down from the top.', 'Tap a switch (the round buttons) to send the track left or right.', 'Every wagon must reach the station of its colour. Three wrong deliveries and the level is lost.'],
  tips: { 0: 'Tap the switch before the wagon reaches it', 5: 'Watch the next wagons at the top' },
  level(i, api) {
    const [S, N, speed, gap] = SPEC[i];
    const root = track(S), switches = [];
    (function walk(n) { if (n.kids) { n.state = 0; switches.push(n); n.kids.forEach(walk); } })(root);
    const start = { x: 0.5, y: 0.02 };
    const R = api.rng;
    const queue = [];
    for (let k = 0; k < N; k++) { let c; do c = (R() * S) | 0; while (k > 1 && c === queue[k - 1] && c === queue[k - 2]); queue.push(c); }
    let spawned = 0, delivered = 0, misses = 0, nextAt = 1.2, time = 0, trains = [], flashes = [];
    let bw = 300, bh = 500, bx = 0, by = 0;
    const C = api.canvas(o => { bw = Math.min(o.w - 8, o.h * 0.75); bh = o.h - 8; bx = (o.w - bw) / 2; by = 4; });
    const P = n => [bx + n.x * bw, by + n.y * bh];
    const hud = () => {
      const next = queue.slice(spawned, spawned + 3).map(c => `<span class="sw" style="background:${COLORS[c]}"></span>`).join('');
      api.info(`<span class="chip">Next: ${next || '–'}</span><span class="chip">${delivered} / ${N}</span><span class="chip${misses ? ' warn' : ''}">✕ ${misses} / 3</span>`);
    };
    hud();
    C.cv.addEventListener('pointerdown', e => {
      if (api.ended()) return;
      const p = C.point(e);
      let best = null, bd = 1e9;
      for (const s of switches) { const [x, y] = P(s), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = s; } }
      if (best && bd < Math.max(50, bw * 0.16)) { best.state ^= 1; api.snd.tap(); api.vib(8); }
    });
    api.loop((dt, now) => {
      if (!api.ended()) {
        time += dt;
        if (spawned < N && time >= nextAt) { trains.push({ c: queue[spawned], from: start, to: root, t: 0 }); spawned++; nextAt = time + gap; hud(); }
        for (const tr of trains) {
          const [x1, y1] = [tr.from.x, tr.from.y], [x2, y2] = [tr.to.x, tr.to.y];
          const len = Math.hypot((x2 - x1) * bw, (y2 - y1) * bh) / bh;
          tr.t += dt * speed / Math.max(0.01, len);
          if (tr.t >= 1) {
            const n = tr.to;
            if (n.kids) { tr.from = n; tr.to = n.kids[n.state]; tr.t = 0; }
            else {
              tr.done = true;
              const ok = n.c === tr.c;
              flashes.push({ n, ok, t0: now });
              if (ok) { delivered++; api.snd.good(); api.vib(10); } else { misses++; api.snd.bad(); api.vib(50); }
              hud();
              if (misses >= 3) api.lose('Three wrong stations', 'Flip the switches early, while the wagon is still above them.');
              else if (delivered + misses === N) api.win(misses ? `${misses} wrong, ${delivered} right` : 'Every wagon on time');
            }
          }
        }
        trains = trains.filter(t => !t.done);
      }
      const { ctx } = C; C.clear();
      // rails
      const rail = (a, b, on) => {
        const [x1, y1] = P(a), [x2, y2] = P(b);
        ctx.lineCap = 'round';
        ctx.strokeStyle = on ? '#c9d6ff' : 'rgba(201,214,255,.18)'; ctx.lineWidth = on ? 9 : 7;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.strokeStyle = 'rgba(7,22,51,.9)'; ctx.lineWidth = 3; ctx.setLineDash([2, 9]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
      };
      rail(start, root, true);
      (function draw(n, on) { if (!n.kids) return; n.kids.forEach((k, j) => { rail(n, k, on && j === n.state); draw(k, on && j === n.state); }); })(root, true);
      // stations
      (function st(n) {
        if (n.kids) return n.kids.forEach(st);
        const [x, y] = P(n), f = flashes.find(fl => fl.n === n && now - fl.t0 < 500);
        const w = Math.min(64, bw * 0.17);
        ctx.fillStyle = COLORS[n.c]; api.rr(ctx, x - w / 2, y - 6, w, 30, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.3)'; api.rr(ctx, x - w / 2 + 5, y - 2, w - 10, 7, 4); ctx.fill();
        if (f) { ctx.strokeStyle = f.ok ? '#fff' : '#ff5468'; ctx.lineWidth = 4; api.rr(ctx, x - w / 2 - 5, y - 11, w + 10, 40, 13); ctx.stroke(); }
      })(root);
      // switches
      for (const s of switches) {
        const [x, y] = P(s), k = s.kids[s.state], [kx, ky] = P(k), ang = Math.atan2(ky - y, kx - x), r = Math.max(20, bw * 0.06);
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#ffc83d'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#c98e17'; ctx.stroke();
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
        ctx.fillStyle = '#2e1d00'; ctx.beginPath(); ctx.moveTo(r * 0.62, 0); ctx.lineTo(-r * 0.2, -r * 0.45); ctx.lineTo(-r * 0.2, r * 0.45); ctx.closePath(); ctx.fill();
        ctx.fillRect(-r * 0.55, -r * 0.14, r * 0.5, r * 0.28);
        ctx.restore();
      }
      // wagons
      for (const tr of trains) {
        const [x1, y1] = P(tr.from), [x2, y2] = P(tr.to), x = x1 + (x2 - x1) * tr.t, y = y1 + (y2 - y1) * tr.t;
        const ang = Math.atan2(y2 - y1, x2 - x1), w = Math.max(30, bw * 0.09);
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
        ctx.fillStyle = 'rgba(0,0,0,.35)'; api.rr(ctx, -w / 2 + 2, -w * 0.32 + 4, w, w * 0.64, 7); ctx.fill();
        ctx.fillStyle = COLORS[tr.c]; api.rr(ctx, -w / 2, -w * 0.32, w, w * 0.64, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.4)'; api.rr(ctx, -w / 2 + 4, -w * 0.32 + 3, w - 8, w * 0.18, 4); ctx.fill();
        ctx.restore();
      }
    });
  },
});

</script>
</body>
</html>
