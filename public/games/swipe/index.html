<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Number Swipe</title>
<meta name="description" content="Swipe tiles; equal numbers merge. Make the target tile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<script src="../kit/firebase-config.js"></script>
<script src="../kit/stats.js"></script>
<script src="../kit/kit.js"></script>
<script>
const TARGET = [32, 64, 64, 128, 128, 256, 256, 512, 512, 1024];
const TINT = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };

Kit.start({
  id: 'swipe', title: 'Number Swipe', accent: ['#edc53f', '#b8901a'],
  help: ['Swipe (or use the arrow keys): every tile slides that way.', 'Two equal tiles that bump into each other merge into their sum.', 'Make the target tile before the board fills up.'],
  tips: { 0: 'Swipe to slide all tiles' },
  level(i, api) {
    const R = api.rng, N = 4, target = TARGET[i];
    let g = new Array(16).fill(0), cs = 70, ox = 0, oy = 0, born = new Array(16).fill(0), best = 2;
    const spawn = () => { const e = g.map((v, k) => (v ? -1 : k)).filter(k => k >= 0); if (!e.length) return; const k = e[(R() * e.length) | 0]; g[k] = R() < 0.9 ? 2 : 4; born[k] = performance.now(); };
    spawn(); spawn();
    const C = api.canvas(o => { cs = Math.floor(Math.min((o.w - 16) / N, (o.h - 16) / N, 96)); ox = (o.w - cs * N) / 2; oy = (o.h - cs * N) / 2; });
    const hud = () => api.info(`<span class="chip">Goal: ${target}</span><span class="chip">Best: ${best}</span>`);
    hud();
    function slide(d) {
      // d: 0 up 1 right 2 down 3 left
      let moved = false, merged = 0;
      for (let a = 0; a < N; a++) {
        const idx = [...Array(N).keys()].map(b => (d === 0 ? b * N + a : d === 2 ? (N - 1 - b) * N + a : d === 3 ? a * N + b : a * N + (N - 1 - b)));
        const vals = idx.map(k => g[k]).filter(Boolean), out = [];
        for (let k = 0; k < vals.length; k++) { if (vals[k] === vals[k + 1]) { out.push(vals[k] * 2); best = Math.max(best, vals[k] * 2); merged++; k++; } else out.push(vals[k]); }
        idx.forEach((k, j) => { const v = out[j] || 0; if (g[k] !== v) moved = true; g[k] = v; });
      }
      return { moved, merged };
    }
    const canMove = () => g.some((v, k) => !v || (k % N < N - 1 && g[k + 1] === v) || (k < 12 && g[k + N] === v));
    function act(d) {
      if (api.ended()) return;
      const r = slide(d);
      if (!r.moved) { api.snd.bad(); return; }
      spawn(); api.snd.whoosh(); if (r.merged) { api.snd.pop(Math.log2(best)); api.vib(8); }
      hud();
      if (best >= target) api.win(`Made ${best}`);
      else if (!canMove()) api.lose('Board full', `Best tile: ${best}. Keep your biggest tile in a corner.`);
    }
    let sx = 0, sy = 0;
    C.cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
    C.cv.addEventListener('pointerup', e => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.hypot(dx, dy) < 22) return; act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); });
    const onKey = e => { const m = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key]; if (m !== undefined) { e.preventDefault(); act(m); } };
    addEventListener('keydown', onKey);
    api.loop((dt, now) => {
      const { ctx } = C; C.clear();
      ctx.fillStyle = '#bbada0'; api.rr(ctx, ox - 8, oy - 8, cs * N + 16, cs * N + 16, 14); ctx.fill();
      for (let k = 0; k < 16; k++) {
        const x = ox + (k % N) * cs, y = oy + ((k / N) | 0) * cs, v = g[k], q = Math.min(1, (now - born[k]) / 150), s = v ? 0.6 + 0.4 * q : 1;
        ctx.fillStyle = v ? TINT[v] || '#3c3a32' : 'rgba(238,228,218,.35)';
        const w = (cs - 10) * s; api.rr(ctx, x + cs / 2 - w / 2, y + cs / 2 - w / 2, w, w, 8); ctx.fill();
        if (v) { ctx.fillStyle = v <= 4 ? '#776e65' : '#f9f6f2'; ctx.font = `900 ${Math.round(cs * (v >= 1000 ? 0.3 : v >= 100 ? 0.36 : 0.44))}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(v), x + cs / 2, y + cs / 2 + 2); }
      }
    });
    return { destroy() { removeEventListener('keydown', onKey); } };
  },
});

</script>
</body>
</html>
