<title>Topple</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one phone-sized column, a dim domino stage in the middle, the tray and the yellow push button at the thumb. */
:root {
  --stage: #15172b;
  --stage-hi: #262a52;
  --panel: #1f2244;
  --panel-hi: #2b2f5c;
  --ivory: #f6efdd;
  --ivory-edge: #c9b996;
  --pip: #3a3550;
  --stone: #a2a8c4;
  --stone-edge: #646b8a;
  --sun: #ffc83d;
  --sun-deep: #c98e17;
  --sun-ink: #3b2600;
  --clock: #ff8a3d;
  --danger: #ff5468;
  --muted: #8e92be;
  --text: #f3f1ff;
  --line: rgba(255, 255, 255, 0.12);
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--stage); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(130% 75% at 50% 38%, var(--stage-hi), var(--stage) 72%) var(--stage);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 800;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px 4px; }
.lvl {
  font-family: var(--font-display); font-size: 20px; letter-spacing: 0.02em;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 14px 3px; font-variant-numeric: tabular-nums;
}
.dots { display: flex; gap: 6px; flex: 1; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-hi); display: block; }
.dots i.done { background: var(--sun); }
.dots i.now { background: transparent; box-shadow: inset 0 0 0 2px var(--sun); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel); display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:disabled { opacity: 0.4; cursor: default; }

#stage { flex: 1; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.dock { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 6px 16px; }
.tray {
  display: flex; align-items: flex-end; gap: 10px; min-height: 64px; padding: 10px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; flex: 1;
}
.tray.shake { animation: shake 0.35s; }
.pc {
  width: 24px; height: 42px; border-radius: 6px; background: var(--ivory);
  box-shadow: 0 4px 0 var(--ivory-edge); position: relative; flex: none;
  transition: transform 0.2s;
}
.pc::before, .pc::after {
  content: ""; position: absolute; left: 50%; width: 6px; height: 6px; margin-left: -3px;
  border-radius: 50%; background: var(--pip);
}
.pc::before { top: 8px; }
.pc::after { bottom: 8px; }
.pc i { position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; margin-top: -1px; background: rgba(58, 53, 80, 0.35); }
.pc.used { background: transparent; box-shadow: none; outline: 2px dashed var(--muted); outline-offset: -2px; opacity: 0.6; }
.pc.used::before, .pc.used::after, .pc.used i { display: none; }
.pc.bonus { box-shadow: 0 4px 0 var(--ivory-edge), 0 0 0 3px var(--sun); animation: glow 1s ease-in-out infinite; }

.push {
  width: 76px; height: 76px; border-radius: 50%; border: none; flex: none;
  background: var(--sun); color: var(--sun-ink);
  box-shadow: 0 6px 0 var(--sun-deep), 0 12px 28px rgba(255, 200, 61, 0.28);
  display: grid; place-items: center; transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
}
.push svg { width: 34px; height: 34px; margin-left: 5px; }
.push:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--sun-deep); }
.push:disabled { filter: grayscale(0.7) brightness(0.6); cursor: default; }
.push.ready { animation: breathe 1.3s ease-in-out infinite; }

.hand { position: fixed; left: 0; top: 0; width: 46px; z-index: 30; pointer-events: none; }
.hand svg { width: 46px; display: block; animation: tap 1.1s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45)); }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0;
  padding-block: 22px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateY(110%); transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.25, 1.15);
  box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.45);
}
.sheet.open { transform: translateY(0); }
.sheet-in { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.res-name { font-family: var(--font-display); font-size: 34px; line-height: 1; letter-spacing: 0.01em; }
.stars { display: flex; gap: 8px; }
.stars svg { width: 44px; height: 44px; transform: scale(0); }
.stars svg.in { animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  background: var(--panel-hi); font-size: 15px; font-variant-numeric: tabular-nums;
}
.chip svg { width: 18px; height: 18px; }
.chip.lost { color: var(--muted); text-decoration: line-through; }
.peek { position: relative; display: grid; place-items: center; }
.peek canvas { display: block; opacity: 0.9; }
.peek b {
  position: absolute; font-family: var(--font-display); font-size: 30px; color: var(--sun-ink);
  background: var(--sun); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--sun-deep);
}
.pct { font-family: var(--font-display); font-size: 64px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.meter { width: min(320px, 100%); height: 12px; border-radius: 999px; background: var(--panel-hi); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--danger), var(--sun)); border-radius: 999px; }
.btns { display: flex; gap: 12px; width: 100%; justify-content: center; flex-wrap: wrap; }
.btn {
  min-height: 58px; padding: 0 26px; border-radius: 18px; border: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-display); font-size: 22px; letter-spacing: 0.02em;
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn svg { width: 26px; height: 26px; }
.btn.primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 5px 0 var(--sun-deep); flex: 1; max-width: 260px; }
.btn.alt { background: var(--panel-hi); color: var(--text); box-shadow: 0 5px 0 #15183a; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn .pc { width: 14px; height: 26px; border-radius: 4px; box-shadow: 0 2px 0 var(--ivory-edge); }
.btn .pc::before { top: 4px; width: 4px; height: 4px; margin-left: -2px; }
.btn .pc::after { bottom: 4px; width: 4px; height: 4px; margin-left: -2px; }

.overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(12, 13, 28, 0.97);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
.ad-chip { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); background: var(--panel-hi); border-radius: 6px; padding: 3px 9px; font-size: 13px; letter-spacing: 0.12em; color: var(--muted); }
.ring { position: relative; width: 110px; height: 110px; }
.ring svg { width: 110px; height: 110px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 44px; }
.reward { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-size: 28px; }
.muted { color: var(--muted); font-weight: 700; font-size: 15px; max-width: 34ch; text-wrap: balance; }

#results { justify-content: flex-start; overflow-y: auto; }
.res-card { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.res-title { font-family: var(--font-display); font-size: 30px; line-height: 1.05; text-wrap: balance; }
.gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.gallery div { aspect-ratio: 1; max-width: 100%; background: var(--panel-hi); border-radius: 12px; display: grid; place-items: center; }
.gallery canvas { max-width: 80%; max-height: 80%; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
th { color: var(--muted); font-weight: 800; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 4px; text-align: right; }
th:first-child, td:first-child { text-align: left; }
td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: right; }
tfoot td { font-family: var(--font-display); font-size: 18px; font-weight: 400; }

@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes glow { 50% { box-shadow: 0 4px 0 var(--ivory-edge), 0 0 0 6px rgba(255, 200, 61, 0.35); } }
@keyframes tap { 0%, 100% { transform: translate(0, 10px); } 45% { transform: translate(0, 0); } 55% { transform: translate(0, 0) scale(0.92); } }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pop { to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .push.ready, .hand svg, .pc.bonus { animation: none; }
  .sheet { transition-duration: 0.01s; }
}
</style>

<div id="app">
  <header class="bar">
    <div class="lvl" id="lvl" aria-label="Level">1/8</div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on or off"></button>
    <button class="icon-btn" id="restartBtn" aria-label="Start this picture again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>
  <main id="stage"><canvas id="board" role="img" aria-label="Domino picture board"></canvas></main>
  <footer class="dock">
    <div class="tray" id="tray" aria-label="Dominoes you can place"></div>
    <button class="push" id="pushBtn" aria-label="Push the first domino">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.2-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
    </button>
  </footer>
</div>

<div class="hand" id="hand" hidden>
  <svg viewBox="0 0 48 56"><path d="M17 6.5a4.5 4.5 0 0 1 9 0V24l2.3-.6a4.4 4.4 0 0 1 5.3 2.7l.2.5 1.9-.4a4.4 4.4 0 0 1 5.2 3l.2.7 1-.1a4.2 4.2 0 0 1 4.4 4.2v8.6C46.5 50 41 54 34 54h-7c-4.4 0-7.6-1.9-10.1-5.4L5.6 33a4 4 0 0 1 5.9-5.4L17 32V6.5z" fill="#fff" stroke="#1b1d33" stroke-width="2.6" stroke-linejoin="round"/></svg>
</div>

<div class="sheet" id="sheet" aria-live="polite"><div class="sheet-in" id="sheetIn"></div></div>

<div class="overlay" id="ad" hidden>
  <div class="ad-chip">AD</div>
  <div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="var(--panel-hi)" stroke-width="9"/><circle id="adArc" cx="55" cy="55" r="48" fill="none" stroke="var(--sun)" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="0"/></svg><b id="adN">3</b></div>
  <div class="reward"><span class="pc"><i></i></span><span>+1</span></div>
  <p class="muted">Pretend this is a video ad. In the real game it gives you one more domino to finish the picture.</p>
</div>

<div class="overlay" id="results" hidden></div>

<script>
(() => {
'use strict';

const LEVELS = /*LEVELS*/[];

// ---------- colours (read from the CSS tokens so there is one source) ----------
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = {
  ivory: tok('--ivory'), ivoryEdge: tok('--ivory-edge'), pip: tok('--pip'), stone: tok('--stone'), stoneEdge: tok('--stone-edge'),
  sun: tok('--sun'), clock: tok('--clock'), danger: tok('--danger'), muted: tok('--muted'), line: tok('--line'),
};
const PAL = { r: '#f0505e', k: '#f8a3c6', o: '#ff9a3c', y: '#ffd54a', g: '#5acb74', G: '#2f9d59', b: '#4f8ef2', c: '#8adaf8',
  p: '#a06ee2', n: '#a06a44', d: '#5a5277', w: '#ffffff', s: '#f4d3a8', '.': '#cbc4e2' };
const CONFETTI = ['#f0505e', '#ffd54a', '#5acb74', '#4f8ef2', '#f8a3c6', '#ff9a3c', '#8adaf8'];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FALL_MS = reduceMotion ? 160 : 270;

// ---------- rules ----------
function parse(L) {
  const H = L.pic.length, W = L.pic[0].length, cells = [];
  let ti = 0, start = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const p = L.pic[y][x], m = L.mask[y][x];
    let kind = p === '.' ? 'none' : 'dom', timer = 0;
    if (m === '_') kind = 'gap';
    else if (m === 'S') { kind = 'dom'; start = y * W + x; }
    else if (m === 'H') kind = 'heavy';
    else if (m === 'T') { kind = 'timer'; timer = L.timers[ti++]; }
    cells.push({ x, y, kind, color: PAL[p] || PAL['.'], blank: p === '.', timer, seed: (x * 7 + y * 13) % 9 });
  }
  return { W, H, cells, start, k: L.k, name: L.name };
}

// One push: every standing domino next to one that just fell falls on the next tick.
// A heavy (stone) domino falls once two of its neighbours have fallen. A timer domino crumbles when its count runs out.
function simulate(lv, standing0, hits0, seeds, t0) {
  const { W, H, cells } = lv, standing = standing0.slice(), hits = hits0.slice();
  const events = [], hitEvents = [], crumbles = [];
  let front = [];
  for (const s of seeds) { if (!standing[s]) continue; standing[s] = false; events.push({ i: s, t: t0, from: -1 }); front.push(s); }
  let t = t0;
  while (front.length) {
    t++;
    const next = [];
    for (const i of front) {
      const x = i % W, y = (i / W) | 0;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx;
        if (!standing[j]) continue;
        if (cells[j].kind === 'heavy') { hits[j]++; hitEvents.push({ i: j, t }); if (hits[j] < 2) continue; }
        standing[j] = false; events.push({ i: j, t, from: i }); next.push(j);
      }
    }
    for (let j = 0; j < cells.length; j++) {
      if (standing[j] && cells[j].kind === 'timer' && cells[j].timer <= t) { standing[j] = false; crumbles.push({ i: j, t }); }
    }
    front = next;
  }
  return { events, hitEvents, crumbles, lastT: t, standing, hits };
}

// ---------- saved progress (this browser only) ----------
const KEY = 'topple.proto.v1';
function freshSave() { return { li: 0, results: [], streak: 0, sound: true }; }
function loadSave() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && typeof d.li === 'number' && Array.isArray(d.results)) return d; } catch (e) {}
  return freshSave();
}
function writeSave() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
let save = loadSave();

// ---------- sound (synthesised, no files) ----------
const Snd = {
  ctx: null, out: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.out = this.ctx.createGain(); this.out.gain.value = 0.55; this.out.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.6), b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && save.sound; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  tone(f, type, peak, dec, when = 0, slide = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dec);
    this.env(g, t, 0.005, peak, dec); o.connect(g).connect(this.out); o.start(t); o.stop(t + dec + 0.06);
  },
  burst(f, q, peak, dec, when = 0, type = 'bandpass') {
    if (!this.ok() || !this.noise) return;
    const c = this.ctx, t = c.currentTime + when, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    this.env(g, t, 0.002, peak, dec); s.connect(fl).connect(g).connect(this.out); s.start(t, Math.random() * 0.3); s.stop(t + dec + 0.06);
  },
  clack(step, count) {
    const scale = [0, 2, 4, 7, 9], st = Math.min(step, 24);
    const semi = Math.floor(st / 5) * 12 + scale[st % 5];
    const v = Math.min(1, 0.5 + 0.12 * Math.log2(1 + count));
    this.burst(2600, 1.2, 0.45 * v, 0.035);
    this.tone(262 * Math.pow(2, semi / 12), 'triangle', 0.15 * v, 0.13);
  },
  place() { this.burst(1100, 2, 0.5, 0.05); this.tone(440, 'sine', 0.22, 0.09, 0, 260); },
  unplace() { this.burst(1500, 2, 0.3, 0.04); this.tone(300, 'sine', 0.14, 0.08, 0, 470); },
  deny() { this.tone(190, 'square', 0.05, 0.1); this.tone(150, 'square', 0.05, 0.12, 0.09); },
  push() {
    if (!this.ok() || !this.noise) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4200, t + 0.2);
    this.env(g, t, 0.02, 0.35, 0.22); s.connect(f).connect(g).connect(this.out); s.start(t); s.stop(t + 0.32);
  },
  thud() { this.tone(120, 'sine', 0.5, 0.2, 0, 65); this.burst(420, 1, 0.3, 0.09); },
  crumble() { this.burst(700, 0.7, 0.5, 0.35, 0, 'lowpass'); this.burst(260, 0.8, 0.45, 0.45, 0.06, 'lowpass'); },
  tick() { this.tone(1900, 'square', 0.04, 0.025); },
  win() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { this.tone(f, 'triangle', 0.2, 0.55, i * 0.085); this.tone(f * 2, 'sine', 0.045, 0.35, i * 0.085 + 0.02); });
    this.tone(1568, 'sine', 0.06, 0.9, 0.38);
  },
  fail() { this.tone(392, 'triangle', 0.2, 0.25); this.tone(330, 'triangle', 0.2, 0.3, 0.17); this.tone(262, 'triangle', 0.2, 0.55, 0.34); },
  star(n) { this.tone(784 * Math.pow(2, n * 4 / 12), 'sine', 0.16, 0.32); },
};
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const canvas = $('#board'), ctx = canvas.getContext('2d'), stage = $('#stage');
const pushBtn = $('#pushBtn'), trayEl = $('#tray'), hand = $('#hand'), sheet = $('#sheet'), sheetIn = $('#sheetIn');
const ICON = {
  soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg>',
  star: on => `<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="${on ? C.sun : 'rgba(255,255,255,.12)'}" stroke="${on ? '#c98e17' : 'none'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
  flame: '<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.3-5.2.3 1.6 1 2.6 2 3C11 8 11 5 12 2z" fill="#ff8a3d"/><path d="M12 13c1 1.6 2.4 2.2 2.4 4a2.4 2.4 0 0 1-4.8 0c0-1.5 1.4-2.3 2.4-4z" fill="#ffd54a"/></svg>',
};

let DPR = 1, CW = 0, CH = 0, cs = 30, ox = 0, oy = 0;
function layout() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  CW = r.width; CH = r.height;
  canvas.width = Math.max(1, Math.round(CW * DPR)); canvas.height = Math.max(1, Math.round(CH * DPR));
  if (!G.lv) return;
  const { W, H } = G.lv;
  cs = Math.max(12, Math.floor(Math.min((CW - 8) / W, (CH - 16) / H, 50)));
  ox = Math.round((CW - cs * W) / 2); oy = Math.round((CH - cs * H) / 2);
}

// ---------- game state ----------
const G = {
  li: 0, lv: null, placed: new Set(), phase: 'plan', bonus: 0, rescueGap: -1,
  fallAt: null, fallFrom: null, spawned: null, hitTimes: null, crumbleAt: null, fillAt: null, placeAt: null,
  standing: null, hits: null, crumbled: null, total: 0,
  ticks: [], tickIdx: 0, curT: 0, lastT: 0, runEnd: 0, resolved: true, sfx: [],
  winAt: 0, failAt: 0, tries: 0, levelStart: 0, firstPush: null, usedRescue: false,
  particles: [], handTarget: null, bbox: null,
};

// play stats (games site): one record per attempt
let attempt = null;
function beginAttempt() { const S = window.GameStats; attempt = S ? { level: G.li, t: S.timer(), done: false } : null; }
function endAttempt(result, stars) {
  const S = window.GameStats;
  if (!S || !attempt || attempt.done) return;
  attempt.done = true; attempt.t.stop();
  const secs = attempt.t.secs();
  if (result !== 'quit' || secs >= 3) S.record({ game: 'topple', level: attempt.level, result, secs, tries: G.tries || 1, stars });
}
addEventListener('pagehide', () => endAttempt('quit'));

function startLevel(li) {
  endAttempt('quit');
  G.li = li; G.lv = parse(LEVELS[li]);
  G.placed = new Set(); G.tries = 0; G.levelStart = performance.now(); G.firstPush = null; G.usedRescue = false;
  const cells = G.lv.cells;
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  cells.forEach(c => { if (c.kind !== 'none') { x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x); y1 = Math.max(y1, c.y); } });
  G.bbox = { x0, y0, x1, y1 };
  resetBoard(); layout(); hideSheet(); renderHud(); updateHand(); beginAttempt();
}

function resetBoard() {
  const n = G.lv.cells.length;
  G.fallAt = new Float64Array(n).fill(Infinity); G.fallFrom = new Int32Array(n).fill(-1); G.spawned = new Uint8Array(n);
  G.hitTimes = Array.from({ length: n }, () => []); G.crumbleAt = new Float64Array(n).fill(Infinity);
  G.fillAt = new Float64Array(n).fill(Infinity); G.placeAt = new Float64Array(n).fill(-1e9);
  G.hits = new Array(n).fill(0); G.crumbled = new Array(n).fill(false); G.standing = null;
  G.ticks = []; G.tickIdx = 0; G.curT = 0; G.lastT = 0; G.resolved = true; G.sfx = [];
  G.winAt = 0; G.failAt = 0; G.phase = 'plan'; G.bonus = 0; G.rescueGap = -1; G.particles = [];
}

function isDomino(c, i) { return c.kind === 'dom' || c.kind === 'heavy' || c.kind === 'timer' || (c.kind === 'gap' && G.placed.has(i)); }

function push() {
  if (G.phase !== 'plan') return;
  Snd.init(); Snd.push(); vib(14);
  G.tries++;
  if (G.firstPush == null) G.firstPush = (performance.now() - G.levelStart) / 1000;
  const cells = G.lv.cells;
  G.standing = cells.map((c, i) => isDomino(c, i));
  G.hits = new Array(cells.length).fill(0);
  G.total = G.standing.filter(Boolean).length;
  const r = simulate(G.lv, G.standing, G.hits, [G.lv.start], 0);
  schedule(r, 0);
  G.phase = 'run'; renderHud(); updateHand();
}

// Turn the simulated ticks into times: the wave speeds up, then slows right down for the last few dominoes
// and while a timer is about to run out.
function schedule(r, t0) {
  const cells = G.lv.cells, base = performance.now() + (t0 === 0 ? 140 : 60);
  const lastFall = r.events.reduce((m, e) => Math.max(m, e.t), t0);
  const timerEnd = {};
  r.events.forEach(e => { if (cells[e.i].kind === 'timer') timerEnd[e.i] = e.t; });
  r.crumbles.forEach(c => { timerEnd[c.i] = c.t; });
  const timers = cells.map((c, i) => (c.kind === 'timer' && G.standing[i] ? i : -1)).filter(i => i >= 0);
  const at = {};
  let acc = 0;
  for (let t = t0; t <= r.lastT; t++) {
    at[t] = base + acc;
    let iv = Math.max(46, 120 * Math.pow(0.935, t - t0));
    if (lastFall - t0 >= 4) { if (t === lastFall - 1) iv *= 3.3; else if (t === lastFall - 2) iv *= 2.1; }
    for (const ti of timers) {
      const end = timerEnd[ti] ?? Infinity, rem = cells[ti].timer - t;
      if (t < end && rem >= 1 && rem <= 3) { iv *= 1.8; break; }
    }
    if (reduceMotion) iv = Math.min(iv, 90);
    acc += iv;
  }
  const byTick = new Map();
  for (const e of r.events) { G.fallAt[e.i] = at[e.t]; G.fallFrom[e.i] = e.from; byTick.set(e.t, (byTick.get(e.t) || 0) + 1); }
  for (const h of r.hitEvents) { G.hitTimes[h.i].push(at[h.t]); G.sfx.push({ at: at[h.t], fn: () => { Snd.thud(); vib(20); } }); }
  for (const c of r.crumbles) { G.crumbleAt[c.i] = at[c.t] + 60; G.crumbled[c.i] = true; G.sfx.push({ at: at[c.t] + 60, fn: () => { Snd.crumble(); vib(40); } }); }
  G.ticks = [];
  for (let t = t0; t <= r.lastT; t++) G.ticks.push({ t, at: at[t], count: byTick.get(t) || 0 });
  G.tickIdx = 0; G.lastT = r.lastT; G.runEnd = at[r.lastT] + 420; G.resolved = false;
  G.standing = r.standing; G.hits = r.hits;
}

function lowTimer(t, now) {
  const cells = G.lv.cells;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.kind !== 'timer' || now >= G.fallAt[i] || now >= G.crumbleAt[i]) continue;
    const rem = c.timer - t;
    if (rem >= 0 && rem <= 3) return true;
  }
  return false;
}

let lastVib = 0;
function update(now) {
  while (G.tickIdx < G.ticks.length && G.ticks[G.tickIdx].at <= now) {
    const tk = G.ticks[G.tickIdx++];
    G.curT = tk.t;
    if (tk.count > 0) { Snd.clack(tk.t, tk.count); if (now - lastVib > 55) { vib(5); lastVib = now; } }
    if (G.phase === 'run' && lowTimer(tk.t, now)) Snd.tick();
  }
  if (G.sfx.length) {
    G.sfx = G.sfx.filter(s => { if (s.at <= now) { s.fn(); return false; } return true; });
  }
  if (!G.resolved && now >= G.runEnd) { G.resolved = true; resolve(now); }
}

function resolve(now) {
  const n = G.lv.cells.length;
  let fallen = 0;
  for (let i = 0; i < n; i++) if (G.fallAt[i] < Infinity) fallen++;
  const win = G.standing.every(s => !s) && !G.crumbled.some(Boolean);
  if (win) winSeq(now);
  else failSeq(Math.min(99, Math.floor(fallen / G.total * 100)));
}

function winSeq(now) {
  G.phase = 'won';
  const { cells, W, start } = G.lv;
  const sx = start % W, sy = (start / W) | 0;
  const fill = [];
  cells.forEach((c, i) => { if (c.kind === 'gap' && !G.placed.has(i) && !c.blank) fill.push(i); });
  fill.sort((a, b) => Math.hypot(cells[a].x - sx, cells[a].y - sy) - Math.hypot(cells[b].x - sx, cells[b].y - sy));
  fill.forEach((i, k) => { G.fillAt[i] = now + 140 + k * 60; G.sfx.push({ at: G.fillAt[i], fn: () => Snd.place() }); });
  G.winAt = now + 140 + fill.length * 60 + 140;
  G.sfx.push({ at: G.winAt, fn: () => { Snd.win(); vib([18, 40, 18]); confetti(); } });
  const base = G.tries === 1 ? 3 : G.tries === 2 ? 2 : 1;
  const stars = G.usedRescue ? Math.min(2, base) : base;
  if (!save.results[G.li]) {
    save.results[G.li] = { tries: G.tries, secs: Math.round((now - G.levelStart) / 1000), first: Math.round(G.firstPush * 10) / 10, stars, rescue: G.usedRescue };
  } else {
    save.results[G.li].stars = Math.max(save.results[G.li].stars, stars);
  }
  save.streak = G.tries === 1 && !G.usedRescue ? (save.streak || 0) + 1 : 0;
  save.li = Math.max(save.li, G.li + 1);
  writeSave(); renderHud();
  endAttempt('win', stars);
  setTimeout(() => showWinSheet(stars), G.winAt - now + 1000);
}

function rescueTargets() {
  const { cells, W, H } = G.lv, out = [];
  cells.forEach((c, i) => {
    if (c.kind !== 'gap' || G.placed.has(i)) return;
    for (const [dx, dy] of DIRS) {
      const x = c.x + dx, y = c.y + dy;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const j = y * W + x;
      if (G.fallAt[j] < Infinity && !G.crumbled[j]) { out.push(i); return; }
    }
  });
  return out;
}

function failSeq(pct) {
  G.phase = 'lost'; G.failAt = performance.now();
  endAttempt('lose', 0);
  Snd.fail(); vib(70);
  const lost = save.streak >= 2 ? save.streak : 0;
  save.streak = 0; writeSave();
  const canRescue = !G.usedRescue && !G.crumbled.some(Boolean) && rescueTargets().length > 0;
  renderHud();
  setTimeout(() => showFailSheet(pct, canRescue, lost), 700);
}

function retry() {
  hideSheet(); endAttempt('quit'); beginAttempt();
  const keep = new Set(G.placed);
  if (G.rescueGap >= 0) keep.delete(G.rescueGap);
  resetBoard(); G.placed = keep; G.usedRescue = false;
  renderHud(); updateHand();
}

function restartLevel() {
  if (G.phase === 'run') return;
  endAttempt('quit'); beginAttempt();
  hideSheet(); resetBoard(); G.placed = new Set(); G.usedRescue = false;
  renderHud(); updateHand();
}

function startRescue() {
  hideSheet(); beginAttempt();
  showAd(() => { G.usedRescue = true; G.bonus = 1; G.phase = 'rescue'; renderHud(); updateHand(); });
}

function resume(g) {
  const { cells, W, H } = G.lv, c = cells[g];
  let from = -1;
  for (const [dx, dy] of DIRS) {
    const x = c.x + dx, y = c.y + dy;
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    const j = y * W + x;
    if (G.fallAt[j] < Infinity) { from = j; break; }
  }
  G.placed.add(g); G.rescueGap = g; G.bonus = 0; G.total++;
  G.placeAt[g] = performance.now();
  const st = G.standing.slice(); st[g] = true; G.standing = st;
  Snd.place(); vib(12);
  const r = simulate(G.lv, G.standing, G.hits, [g], G.lastT + 1);
  schedule(r, G.lastT + 1);
  G.fallFrom[g] = from;
  G.phase = 'run'; renderHud(); updateHand();
}

// ---------- input ----------
canvas.addEventListener('pointerup', e => {
  if (!G.lv) return;
  Snd.init();
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - ox) / cs), y = Math.floor((e.clientY - r.top - oy) / cs);
  if (x < 0 || y < 0 || x >= G.lv.W || y >= G.lv.H) return;
  const i = y * G.lv.W + x, c = G.lv.cells[i];
  if (G.phase === 'plan') {
    if (i === G.lv.start) { push(); return; }
    if (c.kind !== 'gap') return;
    if (G.placed.has(i)) { G.placed.delete(i); Snd.unplace(); vib(6); }
    else if (G.placed.size < G.lv.k) { G.placed.add(i); G.placeAt[i] = performance.now(); Snd.place(); vib(10); }
    else { Snd.deny(); shakeTray(); }
    renderHud(); updateHand();
  } else if (G.phase === 'rescue') {
    if (c.kind === 'gap' && !G.placed.has(i) && rescueTargets().includes(i)) resume(i);
    else if (c.kind === 'gap') Snd.deny();
  }
});
pushBtn.addEventListener('click', () => { Snd.init(); push(); });
$('#restartBtn').addEventListener('click', () => { Snd.init(); restartLevel(); });
$('#soundBtn').addEventListener('click', () => { save.sound = !save.sound; writeSave(); Snd.init(); renderSound(); });
document.addEventListener('pointerdown', () => Snd.init(), { passive: true });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && G.phase === 'plan' && document.activeElement === document.body) { e.preventDefault(); push(); }
});

function shakeTray() { trayEl.classList.remove('shake'); void trayEl.offsetWidth; trayEl.classList.add('shake'); }

// ---------- HUD ----------
function renderSound() { $('#soundBtn').innerHTML = save.sound ? ICON.soundOn : ICON.soundOff; }
function renderHud() {
  $('#lvl').textContent = `${G.li + 1}/${LEVELS.length}`;
  $('#dots').innerHTML = LEVELS.map((_, i) => `<i class="${i === G.li ? 'now' : save.results[i] ? 'done' : ''}"></i>`).join('');
  const k = G.lv.k, used = Math.min(k, [...G.placed].filter(i => i !== G.rescueGap).length);
  let html = '';
  for (let s = 0; s < k; s++) html += `<span class="pc${s >= k - used ? ' used' : ''}"><i></i></span>`;
  if (G.bonus) html += '<span class="pc bonus"><i></i></span>';
  trayEl.innerHTML = html;
  pushBtn.disabled = G.phase !== 'plan';
  pushBtn.classList.toggle('ready', G.phase === 'plan' && G.placed.size === k);
  $('#restartBtn').disabled = G.phase === 'run';
}

function updateHand() {
  let target = null;
  if (G.phase === 'plan' && G.li === 0 && !save.results[0]) {
    if (G.placed.size === 0) {
      const W = G.lv.W;
      target = { cell: 2 * W + 4 };
    } else target = { el: pushBtn };
  } else if (G.phase === 'rescue') {
    const t = rescueTargets();
    if (t.length) target = { cell: t[0] };
  }
  G.handTarget = target; hand.hidden = !target;
  positionHand();
}
function positionHand() {
  const t = G.handTarget;
  if (!t) return;
  let x, y;
  if (t.el) { const r = t.el.getBoundingClientRect(); x = r.left + r.width * 0.52; y = r.top + r.height * 0.55; }
  else { const r = canvas.getBoundingClientRect(), c = G.lv.cells[t.cell]; x = r.left + ox + (c.x + 0.5) * cs; y = r.top + oy + (c.y + 0.55) * cs; }
  hand.style.transform = `translate(${Math.round(x - 17)}px, ${Math.round(y - 2)}px)`;
}

// ---------- sheets and overlays ----------
function hideSheet() { sheet.classList.remove('open'); }
function openSheet(html) { sheetIn.innerHTML = html; requestAnimationFrame(() => sheet.classList.add('open')); }

function showWinSheet(stars) {
  const last = G.li === LEVELS.length - 1;
  const streak = save.streak >= 2 ? `<span class="chip">${ICON.flame}<span>×${save.streak}</span></span>` : '';
  const peek = last ? '' : '<div class="peek"><canvas id="peek"></canvas><b>?</b></div>';
  openSheet(`
    <div class="res-name">${LEVELS[G.li].name}</div>
    <div class="stars">${[0, 1, 2].map(i => ICON.star(i < stars)).join('')}</div>
    ${streak}
    ${peek}
    <div id="tRate" style="width:100%"></div>
    <div class="btns"><button class="btn primary" id="nextBtn">${last ? 'Finish' : 'Next'} ${ICON.next}</button></div>`);
  const svgs = sheetIn.querySelectorAll('.stars svg');
  svgs.forEach((s, i) => setTimeout(() => { s.classList.add('in'); if (i < stars) Snd.star(i); }, 260 + i * 170));
  if (!last) drawMini($('#peek'), LEVELS[G.li + 1], 92, true);
  const GS = window.GameStats;
  if (GS && (G.li === 1 || last) && (GS.myRating('topple') === null || last)) $('#tRate').appendChild(GS.ratePanel('topple'));
  $('#nextBtn').addEventListener('click', () => { hideSheet(); if (last) showResults(); else startLevel(G.li + 1); });
  $('#nextBtn').focus({ preventScroll: true });
}

function showFailSheet(pct, canRescue, lost) {
  const lostChip = lost ? `<span class="chip lost">${ICON.flame}<span>×${lost}</span></span>` : '';
  openSheet(`
    <div class="pct">${pct}%</div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    ${lostChip}
    <div class="btns">
      <button class="btn primary" id="retryBtn" aria-label="Try again">${ICON.retry}</button>
      ${canRescue ? `<button class="btn alt" id="rescueBtn" aria-label="Watch an ad for one more domino">${ICON.film}<span class="pc"><i></i></span>+1</button>` : ''}
    </div>`);
  $('#retryBtn').addEventListener('click', retry);
  if (canRescue) $('#rescueBtn').addEventListener('click', startRescue);
  $('#retryBtn').focus({ preventScroll: true });
}

function showAd(done) {
  const ad = $('#ad'), arc = $('#adArc'), num = $('#adN');
  ad.hidden = false;
  const t0 = performance.now(), dur = 3000;
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / dur);
    arc.setAttribute('stroke-dashoffset', String(301.6 * p));
    num.textContent = String(Math.max(0, Math.ceil(3 - p * 3)));
    if (p < 1) requestAnimationFrame(step);
    else { ad.hidden = true; Snd.place(); done(); }
  };
  requestAnimationFrame(step);
}

// Small picture: finished colours, or a plain silhouette for the "what's next" peek.
function drawMini(cv, L, size, silhouette) {
  const lv = parse(L), m = Math.max(lv.W, lv.H), px = Math.max(2, Math.floor(size / m));
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = lv.W * px * dpr; cv.height = lv.H * px * dpr;
  cv.style.width = lv.W * px + 'px'; cv.style.height = lv.H * px + 'px';
  const c2 = cv.getContext('2d');
  c2.scale(dpr, dpr);
  lv.cells.forEach(c => {
    if (c.kind === 'none' || (c.kind === 'gap' && c.blank)) return;
    c2.fillStyle = silhouette ? 'rgba(246,239,221,.22)' : c.color;
    c2.fillRect(c.x * px + 0.5, c.y * px + 0.5, px - 1, px - 1);
  });
}

function showResults() {
  const el = $('#results');
  const rows = LEVELS.map((L, i) => {
    const r = save.results[i];
    return `<tr><td>${i + 1}. ${L.name}</td><td>${r ? r.tries : '–'}</td><td>${r ? r.first + 's' : '–'}</td><td>${r ? r.secs + 's' : '–'}</td><td>${r ? '★'.repeat(r.stars) : ''}</td></tr>`;
  }).join('');
  const done = save.results.filter(Boolean);
  const totalSecs = done.reduce((a, r) => a + r.secs, 0), totalTries = done.reduce((a, r) => a + r.tries, 0);
  el.innerHTML = `
    <div class="res-card">
      <div class="res-title">${done.length === LEVELS.length ? 'Every picture done' : 'Your pictures'}</div>
      <div class="gallery">${LEVELS.map((_, i) => `<div><canvas data-i="${i}"></canvas></div>`).join('')}</div>
      <table>
        <thead><tr><th>Picture</th><th>Tries</th><th>1st push</th><th>Time</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total</td><td>${totalTries}</td><td></td><td>${Math.floor(totalSecs / 60)}:${String(totalSecs % 60).padStart(2, '0')}</td><td></td></tr></tfoot>
      </table>
      <div id="tRateEnd" style="width:100%"></div>
      <p class="muted">Testing this game? Take a screenshot of this card and send it back.</p>
      <div class="btns"><button class="btn primary" id="againBtn">${ICON.retry} Play again</button></div>
    </div>`;
  el.hidden = false;
  if (window.GameStats) $('#tRateEnd').appendChild(window.GameStats.ratePanel('topple'));
  el.querySelectorAll('canvas[data-i]').forEach(cv => { const i = +cv.dataset.i; drawMini(cv, LEVELS[i], 64, !save.results[i]); });
  $('#againBtn').addEventListener('click', () => {
    save = Object.assign(freshSave(), { sound: save.sound }); writeSave();
    el.hidden = true; startLevel(0);
  });
}

// ---------- drawing ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutBack = q => 1 + 2.70158 * Math.pow(q - 1, 3) + 1.70158 * Math.pow(q - 1, 2);

function tileColor(i) { const c = G.lv.cells[i]; return c.blank ? PAL['.'] : c.color; }

function ripple(i, now) {
  if (!G.winAt || now < G.winAt || reduceMotion) return 1;
  const { cells, start, W } = G.lv, c = cells[i];
  const d = Math.hypot(c.x - start % W, c.y - ((start / W) | 0));
  const q = (now - G.winAt - d * 30) / 380;
  return q <= 0 || q >= 1 ? 1 : 1 + Math.sin(q * Math.PI) * 0.22;
}

function drawTile(x0, y0, color, scale) {
  if (scale <= 0) return;
  const pad = Math.max(1, cs * 0.05), s = (cs - 2 * pad) * scale, cx = x0 + cs / 2, cy = y0 + cs / 2;
  ctx.fillStyle = color; rr(cx - s / 2, cy - s / 2, s, s, s * 0.24); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(cx - s * 0.38, cy - s * 0.4, s * 0.76, s * 0.2, s * 0.1); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.10)'; rr(cx - s / 2, cy + s * 0.3, s, s * 0.2, s * 0.1); ctx.fill();
}

function drawGap(i, x0, y0, now) {
  const glow = (G.phase === 'rescue' && rescueTargets().includes(i)) ||
    (G.phase === 'plan' && G.handTarget && G.handTarget.cell === i);
  const inset = cs * 0.16, s = cs - 2 * inset;
  ctx.save();
  if (glow) {
    const a = 0.25 + 0.2 * Math.sin(now / 160);
    ctx.fillStyle = `rgba(255,200,61,${a})`; rr(x0 + inset, y0 + inset, s, s, s * 0.25); ctx.fill();
  }
  ctx.setLineDash([Math.max(2, cs * 0.1), Math.max(2, cs * 0.08)]);
  ctx.lineWidth = Math.max(1.3, cs * 0.05);
  ctx.strokeStyle = glow ? C.sun : 'rgba(190,195,240,.5)';
  rr(x0 + inset, y0 + inset, s, s, s * 0.25); ctx.stroke();
  ctx.restore();
}

function pips(n, cx, cy, dw, dh, r) {
  const ox2 = dw * 0.2, oy2 = dh * 0.11;
  const pts = n === 1 ? [[0, 0]] : n === 2 ? [[-1, -1], [1, 1]] : [[-1, -1], [0, 0], [1, 1]];
  ctx.fillStyle = C.pip;
  for (const [a, b] of pts) { ctx.beginPath(); ctx.arc(cx + a * ox2, cy + b * oy2, r, 0, Math.PI * 2); ctx.fill(); }
}

function drawDomino(i, x0, y0, now) {
  const c = G.lv.cells[i], fa = G.fallAt[i];
  const cx = x0 + cs / 2, by = y0 + cs * 0.94;
  const dw = cs * 0.56, dh = cs * 0.84, th = Math.max(2, cs * 0.075), rad = cs * 0.12;
  const p = now >= fa ? clamp01((now - fa) / (FALL_MS * 0.5)) : 0;
  const isStart = i === G.lv.start, placed = c.kind === 'gap';
  ctx.save();
  ctx.translate(cx, by);
  // halo behind the start domino while waiting for the push
  if (isStart && G.phase === 'plan') {
    const a = 0.22 + 0.14 * Math.sin(now / 220);
    ctx.fillStyle = `rgba(255,200,61,${a})`;
    ctx.beginPath(); ctx.arc(0, -dh / 2, cs * 0.62, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0, th * 0.7, dw * 0.78 * (1 - p * 0.4), cs * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  let sh = 0;
  for (const ht of G.hitTimes[i]) if (now >= ht && now - ht < 200) sh += Math.sin((now - ht) / 16) * cs * 0.06;
  if (G.phase === 'lost' && !reduceMotion) { const q = now - G.failAt; if (q < 500) sh += Math.sin(q / 30) * cs * 0.05 * (1 - q / 500); }
  ctx.translate(sh, 0);
  if (p > 0) {
    const from = G.fallFrom[i];
    let dx = 1, dy = 0;
    if (from >= 0) { dx = c.x - G.lv.cells[from].x; dy = c.y - G.lv.cells[from].y; }
    const e = p * p;
    if (dx !== 0) { ctx.translate(dx * dw / 2, 0); ctx.rotate(dx * e * Math.PI / 2 * 0.95); ctx.translate(-dx * dw / 2, 0); }
    else { ctx.translate(0, dy * cs * 0.28 * e); ctx.scale(1, 1 - 0.82 * e); }
    ctx.globalAlpha = 1 - clamp01((p - 0.6) / 0.4) * 0.7;
  }
  const dq = (now - G.placeAt[i]) / 240;
  if (dq >= 0 && dq < 1) { const k = 1 - easeOutBack(dq); ctx.translate(0, -k * cs * 0.6); }
  const heavy = c.kind === 'heavy';
  ctx.fillStyle = heavy ? C.stoneEdge : C.ivoryEdge; rr(-dw / 2, -dh + th, dw, dh, rad); ctx.fill();
  ctx.fillStyle = heavy ? C.stone : C.ivory; rr(-dw / 2, -dh, dw, dh, rad); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(-dw / 2 + dw * 0.12, -dh + dh * 0.06, dw * 0.18, dh * 0.5, dw * 0.09); ctx.fill();
  const pr = Math.max(1.2, cs * 0.045);
  if (isStart) {
    ctx.fillStyle = C.sun;
    const s = dw * 0.36;
    ctx.beginPath(); ctx.moveTo(-s * 0.55, -dh / 2 - s); ctx.lineTo(s * 0.85, -dh / 2); ctx.lineTo(-s * 0.55, -dh / 2 + s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c98e17'; ctx.lineWidth = Math.max(1, cs * 0.03); ctx.lineJoin = 'round'; ctx.stroke();
  } else if (heavy) {
    const shown = G.hitTimes[i].filter(t => now >= t).length;
    if (shown >= 1) {
      ctx.strokeStyle = 'rgba(40,40,60,.55)'; ctx.lineWidth = Math.max(1, cs * 0.035);
      ctx.beginPath(); ctx.moveTo(-dw * 0.3, -dh * 0.85); ctx.lineTo(-dw * 0.05, -dh * 0.62); ctx.lineTo(-dw * 0.2, -dh * 0.45); ctx.lineTo(dw * 0.1, -dh * 0.2); ctx.stroke();
    }
    for (let k = 0; k < 2; k++) {
      ctx.beginPath(); ctx.arc(0, -dh * (k === 0 ? 0.7 : 0.3), cs * 0.085, 0, Math.PI * 2);
      ctx.fillStyle = k < shown ? C.sun : 'rgba(40,42,70,.55)'; ctx.fill();
    }
  } else if (c.kind === 'timer') {
    const rem = G.phase === 'plan' ? c.timer : Math.max(0, c.timer - G.curT);
    const low = rem <= 3 && G.phase !== 'plan';
    const r = cs * 0.34 * (low ? 1 + 0.12 * Math.sin(now / 70) : 1);
    ctx.beginPath(); ctx.arc(0, -dh / 2, r, 0, Math.PI * 2);
    ctx.fillStyle = low ? C.danger : C.clock; ctx.fill();
    ctx.lineWidth = Math.max(1.5, cs * 0.05); ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(cs * 0.4)}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(rem), 0, -dh / 2 + cs * 0.015);
  } else {
    ctx.fillStyle = 'rgba(58,53,80,.35)'; ctx.fillRect(-dw * 0.34, -dh / 2 - 0.5, dw * 0.68, Math.max(1, cs * 0.03));
    if (cs >= 26) { pips(1 + (c.seed % 3), 0, -dh * 0.74, dw, dh, pr); pips(1 + ((c.seed * 5 + 1) % 3), 0, -dh * 0.26, dw, dh, pr); }
    else { pips(1, 0, -dh * 0.74, dw, dh, pr); pips(1, 0, -dh * 0.26, dw, dh, pr); }
  }
  if (placed) { ctx.strokeStyle = C.sun; ctx.lineWidth = Math.max(1.5, cs * 0.06); rr(-dw / 2, -dh, dw, dh, rad); ctx.stroke(); }
  if (G.phase === 'lost' && now < fa) {
    const a = 0.55 + 0.35 * Math.sin(now / 150);
    ctx.strokeStyle = `rgba(255,84,104,${a})`; ctx.lineWidth = Math.max(2, cs * 0.08); rr(-dw / 2, -dh, dw, dh, rad); ctx.stroke();
  }
  ctx.restore();
}

function spawn(x, y, color, n, speed, life, size, gravity) {
  if (reduceMotion) return;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, life, max: life, color, size: size * (0.6 + Math.random() * 0.6), g: gravity, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, rect: false });
  }
}
function confetti() {
  if (reduceMotion) return;
  for (let k = 0; k < 90; k++) {
    G.particles.push({ x: CW * (0.15 + Math.random() * 0.7), y: -10 - Math.random() * 40, vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 160,
      life: 2.4, max: 2.4, color: CONFETTI[k % CONFETTI.length], size: 5 + Math.random() * 5, g: 160, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, rect: true });
  }
}

let lastNow = performance.now();
function draw(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  if (!G.lv) return;
  const { cells, W } = G.lv, b = G.bbox;
  // soft panel behind the picture
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  rr(ox + b.x0 * cs - cs * 0.3, oy + b.y0 * cs - cs * 0.3, (b.x1 - b.x0 + 1.6) * cs, (b.y1 - b.y0 + 1.6) * cs, cs * 0.5); ctx.fill();
  // flat layer: gaps and fallen tiles
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.kind === 'none') continue;
    const x0 = ox + c.x * cs, y0 = oy + c.y * cs;
    if (c.kind === 'gap' && !G.placed.has(i)) {
      if (now >= G.fillAt[i]) drawTile(x0, y0, c.color, (0.3 + 0.7 * easeOutBack(clamp01((now - G.fillAt[i]) / 260))) * ripple(i, now));
      else if (!(G.phase === 'won' && c.blank)) drawGap(i, x0, y0, now);
      continue;
    }
    const fa = G.fallAt[i], half = FALL_MS * 0.5;
    if (now >= fa + half) {
      const q = clamp01((now - fa - half) / half);
      drawTile(x0, y0, tileColor(i), (0.35 + 0.65 * easeOutBack(q)) * ripple(i, now));
      if (!G.spawned[i]) { G.spawned[i] = 1; spawn(x0 + cs / 2, y0 + cs / 2, tileColor(i), 3, cs * 3, 0.35, cs * 0.12, 0); }
    }
  }
  // raised layer: standing and falling dominoes, top row first
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (!isDomino(c, i)) continue;
    const fa = G.fallAt[i];
    if (now >= fa + FALL_MS * 0.5) continue;
    if (now >= G.crumbleAt[i]) {
      if (G.spawned[i] !== 2) { G.spawned[i] = 2; spawn(ox + (c.x + 0.5) * cs, oy + (c.y + 0.5) * cs, C.ivoryEdge, 14, cs * 3.5, 0.7, cs * 0.16, cs * 14); }
      continue;
    }
    drawDomino(i, ox + c.x * cs, oy + c.y * cs, now);
  }
  // particles
  G.particles = G.particles.filter(p => (p.life -= dt) > 0);
  for (const p of G.particles) {
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.globalAlpha = clamp01(p.life / p.max * 1.5);
    ctx.fillStyle = p.color;
    if (p.rect) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  update(now);
  draw(now);
  positionHand();
  requestAnimationFrame(frame);
}

// ---------- boot ----------
function boot(data) {
  if (data && data.save && typeof data.save.li === 'number') save = data.save;
  renderSound();
  new ResizeObserver(layout).observe(stage);
  if (save.li >= LEVELS.length) { startLevel(LEVELS.length - 1); showResults(); }
  else startLevel(save.li);
  requestAnimationFrame(frame);
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({ save })); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
